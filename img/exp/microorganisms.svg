  <g stroke="#e53935" stroke-width="5" stroke-linecap="round"><line x1="88" y1="190" x2="118" y2="190"/><line x1="298" y1="190" x2="328" y2="190"/></g>
  <path d="M262 186 V96" stroke="#43a047" stroke-width="5" marker-end="url(#a)"/>
  <!-- spoon of yeast and the marker -->
  <path d="M488 250 L566 226" stroke="#9e9e9e" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="478" cy="252" rx="22" ry="9" fill="#bdbdbd"/>
  <g fill="#8d6e63"><circle cx="470" cy="249" r="3"/><circle cx="479" cy="247" r="3"/><circle cx="487" cy="250" r="3"/><circle cx="475" cy="254" r="3"/></g>
  <rect x="470" y="276" width="84" height="14" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <rect x="540" y="276" width="30" height="14" rx="6" fill="#e53935"/>
