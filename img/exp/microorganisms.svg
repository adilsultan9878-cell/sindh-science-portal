  <!-- warm place -->
  <circle cx="540" cy="62" r="24" fill="#ffd54f"/>
  <g stroke="#ffb300" stroke-width="5" stroke-linecap="round">
    <line x1="540" y1="20" x2="540" y2="30"/><line x1="498" y1="62" x2="508" y2="62"/><line x1="572" y1="62" x2="582" y2="62"/>
    <line x1="510" y1="32" x2="517" y2="39"/><line x1="570" y1="32" x2="563" y2="39"/><line x1="540" y1="94" x2="540" y2="104"/>
  </g>
  <!-- dough with yeast: risen high above its mark, full of bubbles -->
  <path d="M103 258 L93 100 C90 58 230 58 227 100 L217 258z" fill="#f5deb3" stroke="#c9a46b" stroke-width="3"/>
  <g fill="#fffaf0" stroke="#e0c48c" stroke-width="1.5">
