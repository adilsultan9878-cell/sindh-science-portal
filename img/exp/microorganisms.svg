    <circle cx="118" cy="150" r="4"/><circle cx="188" cy="108" r="6"/><circle cx="160" cy="236" r="4"/><circle cx="128" cy="94" r="4"/>
  </g>
  <!-- dough without yeast: still at its mark -->
