<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <rect width="600" height="320" fill="#f6fbf6"/>
  <rect x="0" y="262" width="600" height="58" fill="#e0e0e0"/>
  <!-- books -->
  <rect x="30" y="200" width="110" height="22" rx="3" fill="#42a5f5"/>
  <rect x="36" y="222" width="104" height="20" rx="3" fill="#ef5350"/>
  <rect x="30" y="242" width="110" height="20" rx="3" fill="#66bb6a"/>
  <!-- ramp board -->
  <path d="M60 196 L300 258 L300 264 L56 202z" fill="#a1887f" stroke="#795548" stroke-width="2"/>
  <!-- toy car rolling down -->
  <g transform="rotate(14.5 170 214)">
    <rect x="140" y="194" width="62" height="20" rx="6" fill="#e53935"/>
    <path d="M152 194 l8 -14 h26 l8 14z" fill="#ef9a9a" stroke="#e53935" stroke-width="2"/>
    <circle cx="156" cy="216" r="8" fill="#37474f"/><circle cx="188" cy="216" r="8" fill="#37474f"/>
  </g>
  <!-- rough towel at the bottom of the ramp -->
  <rect x="300" y="256" width="170" height="12" fill="#ffb74d"/>
  <g stroke="#f57c00" stroke-width="3"><line x1="310" y1="256" x2="310" y2="268"/><line x1="330" y1="256" x2="330" y2="268"/><line x1="350" y1="256" x2="350" y2="268"/><line x1="370" y1="256" x2="370" y2="268"/><line x1="390" y1="256" x2="390" y2="268"/><line x1="410" y1="256" x2="410" y2="268"/><line x1="430" y1="256" x2="430" y2="268"/><line x1="450" y1="256" x2="450" y2="268"/></g>
  <!-- how far the car goes: short on the towel, long on the smooth floor -->
  <defs>
    <marker id="o" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#f57c00"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2e7d32"/></marker>
  </defs>
  <path d="M305 236 h90" stroke="#f57c00" stroke-width="5" marker-end="url(#o)"/>
  <path d="M305 296 h260" stroke="#2e7d32" stroke-width="5" marker-end="url(#g)"/>
</svg>
