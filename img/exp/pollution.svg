<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <rect width="600" height="320" fill="#f6fbf6"/>
  <rect x="0" y="272" width="600" height="48" fill="#d7ccc8"/>
  <!-- labels on sticks, each with a small picture of what is buried -->
  <g stroke="#a1887f" stroke-width="4"><line x1="150" y1="60" x2="150" y2="130"/><line x1="340" y1="60" x2="340" y2="130"/><line x1="530" y1="60" x2="530" y2="130"/></g>
  <g fill="#ffffff" stroke="#b0bec5" stroke-width="2"><rect x="124" y="26" width="52" height="40" rx="5"/><rect x="314" y="26" width="52" height="40" rx="5"/><rect x="504" y="26" width="52" height="40" rx="5"/></g>
  <path d="M136 36 q14 24 30 6 q-14 10 -30 -6z" fill="#fdd835" stroke="#f9a825" stroke-width="2"/>
  <rect x="328" y="33" width="24" height="26" fill="#fafafa" stroke="#90a4ae" stroke-width="2"/><path d="M332 41 h16 M332 47 h16 M332 53 h10" stroke="#b0bec5" stroke-width="2"/>
  <path d="M518 38 h24 l-3 22 h-18z M523 38 q7 -10 14 0" fill="#64b5f6" stroke="#1e88e5" stroke-width="2"/>
  <!-- three pots of soil, cut open to show what is inside -->
  <g fill="#795548" stroke="#c76b42" stroke-width="8" stroke-linejoin="round">
    <path d="M30 126 h160 l-20 146 h-120z"/><path d="M220 126 h160 l-20 146 h-120z"/><path d="M410 126 h160 l-20 146 h-120z"/>
  </g>
  <g fill="#e08a5e" stroke="#a65a37" stroke-width="3"><rect x="22" y="114" width="176" height="18" rx="4"/><rect x="212" y="114" width="176" height="18" rx="4"/><rect x="402" y="114" width="176" height="18" rx="4"/></g>
  <g fill="#8d6e63"><circle cx="70" cy="150" r="3"/><circle cx="140" cy="236" r="3"/><circle cx="260" cy="240" r="3"/><circle cx="350" cy="154" r="3"/><circle cx="450" cy="236" r="3"/><circle cx="540" cy="150" r="3"/></g>
  <!-- peel: almost rotted away -->
  <g fill="#8d7a3a" stroke="#5d4037" stroke-width="2"><path d="M80 184 q14 -8 26 2 q-10 10 -26 -2z"/><path d="M114 196 q10 -6 18 2 q-8 8 -18 -2z"/><path d="M92 206 q8 -5 14 1 q-6 6 -14 -1z"/></g>
  <!-- paper: soft and breaking up -->
  <path d="M262 178 l26 -6 l6 10 l18 -4 l6 30 l-20 4 l-4 -8 l-26 6z" fill="#efebe9" stroke="#bcaaa4" stroke-width="2"/>
  <path d="M320 196 l10 -2 l3 12 l-10 2z" fill="#efebe9" stroke="#bcaaa4" stroke-width="2"/>
  <!-- plastic: exactly the same -->
  <path d="M452 176 h70 l-6 40 h-58z" fill="#64b5f6" stroke="#1e88e5" stroke-width="3"/>
  <path d="M462 184 v24 M490 182 v28" stroke="#bbdefb" stroke-width="4" stroke-linecap="round"/>
  <!-- soil microbes at work on the peel and the paper -->
  <g fill="#9ccc65"><circle cx="74" cy="198" r="4"/><circle cx="124" cy="182" r="4"/><circle cx="100" cy="220" r="3"/><circle cx="256" cy="200" r="4"/><circle cx="300" cy="222" r="3"/><circle cx="318" cy="180" r="4"/></g>
  <!-- a little water every other day -->
  <g fill="#42a5f5"><path d="M86 84 q-7 12 0 15 q7 -3 0 -15z"/><path d="M276 84 q-7 12 0 15 q7 -3 0 -15z"/><path d="M466 84 q-7 12 0 15 q7 -3 0 -15z"/></g>
</svg>
