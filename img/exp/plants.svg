    <line x1="510" y1="20" x2="510" y2="36"/><line x1="510" y1="104" x2="510" y2="120"/>
    <line x1="460" y1="70" x2="476" y2="70"/><line x1="544" y1="70" x2="560" y2="70"/>
    <line x1="475" y1="35" x2="486" y2="46"/><line x1="534" y1="94" x2="545" y2="105"/>
    <line x1="545" y1="35" x2="534" y2="46"/><line x1="486" y1="94" x2="475" y2="105"/>
  </g>
  <circle cx="510" cy="70" r="26" fill="#ffd54f"/>
  <!-- sunlight -->
  <g stroke="#ffe082" stroke-width="4" stroke-dasharray="10 10">
    <line x1="470" y1="110" x2="380" y2="150"/><line x1="480" y1="130" x2="390" y2="190"/>
  </g>
  <!-- ground -->
  <rect x="0" y="290" width="600" height="30" fill="#d7ccc8"/>
