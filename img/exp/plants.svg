  <path d="M400 250 l40 0" stroke="#78909c" stroke-width="4" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#78909c"/></marker></defs>
  <path d="M452 250 C490 230 540 236 576 262 C540 288 490 290 452 250z" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <path d="M496 238 C512 236 528 238 540 242 v40 C528 286 512 286 496 282z" fill="#fff59d"/>
