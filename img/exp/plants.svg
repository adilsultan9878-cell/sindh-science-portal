  <rect x="182" y="198" width="156" height="20" rx="4" fill="#e08a5e" stroke="#a65a37" stroke-width="3"/>
  <!-- stem and leaves -->
  <path d="M260 200 C258 160 262 110 260 60" stroke="#388e3c" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M260 170 C220 160 196 140 186 116 C220 112 248 132 260 170z" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <path d="M260 130 C296 118 322 96 332 72 C298 70 270 92 260 130z" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <path d="M260 96 C232 86 214 66 210 44 C238 46 256 66 260 96z" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <!-- the covered leaf: black paper on part of it, held by a clip -->
  <path d="M261 160 C306 156 344 170 372 196 C334 214 288 200 261 160z" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <path d="M300 160 h44 v52 h-44z" fill="#263238"/>
