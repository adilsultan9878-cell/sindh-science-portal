<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <rect width="600" height="320" fill="#f6fbf6"/>
  <rect x="0" y="270" width="600" height="50" fill="#d7ccc8"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#78909c"/></marker>
    <clipPath id="b"><rect x="300" y="90" width="100" height="180" rx="14"/></clipPath>
  </defs>
  <!-- shaken bottle: soil and water all mixed -->
  <rect x="70" y="100" width="100" height="170" rx="14" fill="#a1887f"/>
  <g stroke="#90a4ae" stroke-width="4" fill="none" stroke-linecap="round"><path d="M50 130 q-14 30 0 60"/><path d="M36 120 q-18 40 0 80"/><path d="M190 130 q14 30 0 60"/><path d="M204 120 q18 40 0 80"/></g>
  <!-- one day later: layers -->
  <g clip-path="url(#b)">
    <rect x="300" y="100" width="100" height="84" fill="#e8f4f8"/>
    <rect x="300" y="184" width="100" height="20" fill="#bcaaa4"/>
    <rect x="300" y="204" width="100" height="28" fill="#8d6e63"/>
    <rect x="300" y="232" width="100" height="40" fill="#e6c48f"/>
  </g>
  <g fill="#c9a46b"><circle cx="314" cy="244" r="3"/><circle cx="332" cy="258" r="3"/><circle cx="352" cy="242" r="3"/><circle cx="372" cy="256" r="3"/><circle cx="388" cy="244" r="3"/><circle cx="322" cy="262" r="2"/><circle cx="362" cy="262" r="2"/></g>
  <!-- humus floating on top -->
  <g fill="#5d4037"><path d="M312 104 l12 -3 l2 5 l-12 3z"/><path d="M340 102 l9 0 l-2 6 l-8 -1z"/><path d="M366 105 l12 -4 l1 5 l-11 3z"/><circle cx="388" cy="104" r="3"/></g>
  <!-- the two bottles: outline, neck and lid -->
  <g fill="#e3f2fd" fill-opacity="0.3" stroke="#90a4ae" stroke-width="4">
    <rect x="70" y="90" width="100" height="180" rx="14"/><rect x="100" y="62" width="40" height="30"/>
    <rect x="300" y="90" width="100" height="180" rx="14"/><rect x="330" y="62" width="40" height="30"/>
  </g>
  <g fill="#43a047"><rect x="96" y="44" width="48" height="20" rx="4"/><rect x="326" y="44" width="48" height="20" rx="4"/></g>
  <path d="M206 236 h62" stroke="#78909c" stroke-width="5" marker-end="url(#a)"/>
  <!-- ruler -->
  <rect x="420" y="90" width="28" height="180" fill="#fff59d" stroke="#fbc02d" stroke-width="3"/>
  <path d="M420 105h10M420 120h16M420 135h10M420 150h16M420 165h10M420 180h16M420 195h10M420 210h16M420 225h10M420 240h16M420 255h10" stroke="#8d6e63" stroke-width="2"/>
  <!-- garden soil -->
  <path d="M478 270 q14 -48 52 -50 q38 2 52 50z" fill="#795548"/>
  <g fill="#5d4037"><circle cx="512" cy="248" r="4"/><circle cx="540" cy="236" r="3"/><circle cx="556" cy="256" r="4"/></g>
  <path d="M520 226 q4 -14 14 -18" stroke="#66bb6a" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
