<style>
  .cz-projects { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 12px 0; }
  .cz-proj { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; border: 2px solid var(--line, #d6e6d8); border-radius: 14px; background: #fff; cursor: pointer; font: inherit; color: inherit; text-align: center; }
  .cz-proj .em { font-size: 2rem; line-height: 1; }
  .cz-proj[aria-pressed="true"] { border-color: #2e7d32; background: #e8f5e9; box-shadow: 0 0 0 2px #2e7d32 inset; }
  .cz-steps { margin: 8px 0; padding-inline-start: 1.4em; }
  .cz-steps li { margin: 6px 0; }
  .cz-form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .cz-form .field { max-width: none; margin: 0; }
  .cz-form input, .cz-form select { width: 100%; box-sizing: border-box; }
  .cz-form .full { grid-column: 1 / -1; }
  .cz-radio { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .cz-radio label { display: inline-flex; align-items: center; gap: 6px; }
  .cz-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .cz-tabs button[aria-pressed="true"] { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  .cz-map { width: 100%; max-width: 460px; height: auto; display: block; margin: 0 auto; }
  .cz-map .land { fill: #f3f8f1; stroke: #7aa883; stroke-width: 1.5; }
  .cz-map .river { fill: none; stroke: #8ec5e8; stroke-width: 2.5; }
  .cz-map .sea { fill: #e3f1fb; }
  .cz-map circle { stroke: #fff; stroke-width: 1.5; cursor: pointer; }
  .cz-map circle.sel { stroke: #c62828; stroke-width: 3; }
  .cz-map text { font-family: "Segoe UI", Arial, sans-serif; font-size: 9px; fill: #1b3d22; pointer-events: none; }
  .cz-map text.n { font-size: 9px; font-weight: 700; fill: #fff; }
  .cz-legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; font-size: 0.85rem; color: var(--muted); }
  .cz-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-inline-end: 4px; }
  .cz-table th, .cz-table td { text-align: center; white-space: nowrap; }
  .cz-table th:first-child, .cz-table td:first-child { text-align: start; }
  .cz-table tr.sel td { background: #fff6dd; }
  .cz-recent { list-style: none; padding: 0; margin: 0; }
  .cz-recent li { padding: 6px 0; border-bottom: 1px solid #e6efe7; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
</style>
